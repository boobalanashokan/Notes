name: Update study progress

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - README.md
      - TRACKER.md
      - TODAY.md
      - PROJECT_TASKS.md
      - SKILLS.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate all progress views
        run: python scripts/tracker.py

      - name: Commit generated tracker changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md TRACKER.md TODAY.md PROJECT_TASKS.md SKILLS.md

          if git diff --cached --quiet; then
            echo "No tracker changes."
          else
            git commit -m "Update MLOps tracker"
            git push
          fi
